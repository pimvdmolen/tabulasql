name: Build desktop app

# Runs on every push to main (build-only sanity check, nothing published),
# on version tags (build + create/attach GitHub Release assets), whenever a
# GitHub Release is published, and on manual workflow_dispatch.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # needed to attach files to a release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # nativephp/php-bin's own bundled PHP has no pdo_mysql/sodium (see
          # scripts/ci/fetch-static-php.php). Linux/macOS jobs download a
          # verified static-php-cli "bulk" build; Windows builds one (spc-max
          # omits sodium). The zip filename must be "php-{php_version}.zip",
          # so php_version here must match exactly what Setup PHP installs.
          - os: ubuntu-latest
            target: linux x64
            label: linux-x64
            php_version: '8.4'
            spc_os: linux
            spc_arch: x64
            spc_mode: download
            spc_url: https://dl.static-php.dev/static-php-cli/bulk/php-8.4.23-cli-linux-x86_64.tar.gz
            spc_archive: tar.gz
          # Windows "spc-max" prebuilds omit sodium (confirmed in their
          # README / upstream EXTENSIONS list), so we build a custom CLI
          # with sodium via static-php-cli instead of downloading one.
          - os: windows-latest
            target: win x64
            label: windows-x64
            php_version: '8.4'
            spc_os: win
            spc_arch: x64
            spc_mode: build
          - os: macos-latest
            target: mac arm64
            label: macos-arm64
            php_version: '8.4'
            spc_os: mac
            spc_arch: arm64
            spc_mode: download
            spc_url: https://dl.static-php.dev/static-php-cli/bulk/php-8.4.23-cli-macos-aarch64.tar.gz
            spc_archive: tar.gz
          - os: macos-latest
            target: mac x64
            label: macos-x64
            php_version: '8.4'
            spc_os: mac
            spc_arch: x64
            spc_mode: download
            spc_url: https://dl.static-php.dev/static-php-cli/bulk/php-8.4.23-cli-macos-x86_64.tar.gz
            spc_archive: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          extensions: pdo_mysql, sqlite3, sodium, mbstring, zip, fileinfo
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install NPM dependencies
        run: npm ci

      - name: Build front-end assets
        run: npm run build

      # nativephp/php-bin's default bundled PHP lacks pdo_mysql and sodium
      # (verified against the actual downloaded package — see
      # nativephp-php-bin-custom/README.md), which would silently break both
      # MySQL connections and encrypted connection export/import in any
      # build that used it. Replace it with a static-php-cli build that has
      # both, and point NATIVEPHP_PHP_BINARY_PATH at it. Linux/macOS download
      # a prebuilt "bulk" archive; Windows builds one (spc-max has no sodium).
      # Either path verifies the binary by executing it on the matching OS.
      # NativePHP's LocatesPhpBinary does sourcePath(env . 'bin/'). Symfony
      # Path::join treats an absolute env path as a relative segment, so
      # /tmp/... becomes <repo>/tmp/... and php.js cannot find the zip.
      # Keep this path relative to the repo root (same as local .env).
      - name: Fetch a portable PHP runtime with pdo_mysql + sodium
        if: matrix.spc_mode == 'download'
        shell: bash
        run: |
          php -d memory_limit=-1 scripts/ci/fetch-static-php.php \
            "${{ matrix.spc_url }}" \
            "${{ matrix.spc_archive }}" \
            "${{ matrix.spc_os }}" \
            "${{ matrix.spc_arch }}" \
            "${{ matrix.php_version }}" \
            nativephp-php-bin-custom
          test -f "nativephp-php-bin-custom/bin/${{ matrix.spc_os }}/${{ matrix.spc_arch }}/php-${{ matrix.php_version }}.zip"
          echo "NATIVEPHP_PHP_BINARY_PATH=nativephp-php-bin-custom/" >> "$GITHUB_ENV"

      # Cache the Windows-built PHP zip so we don't recompile from source on
      # every push (spc build is several minutes). Key includes the script so
      # extension-list changes bust the cache automatically.
      - name: Cache Windows static PHP build
        if: matrix.spc_mode == 'build'
        id: win-php-cache
        uses: actions/cache@v4
        with:
          path: nativephp-php-bin-custom
          key: win-static-php-${{ matrix.php_version }}-${{ hashFiles('scripts/ci/build-windows-static-php.ps1') }}

      - name: Build a portable PHP runtime with pdo_mysql + sodium (Windows)
        if: matrix.spc_mode == 'build' && steps.win-php-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          $script = Join-Path $pwd 'scripts/ci/build-windows-static-php.ps1'
          if (-not (Test-Path $script)) { throw "Script not found: $script" }
          Write-Host "Invoking $script"
          & $script -PhpVersion '${{ matrix.php_version }}' -DestBaseDir (Join-Path $pwd 'nativephp-php-bin-custom')
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw "build-windows-static-php.ps1 exited with code $LASTEXITCODE"
          }

      - name: Point NativePHP at the Windows PHP runtime
        if: matrix.spc_mode == 'build'
        shell: bash
        run: |
          ls -la nativephp-php-bin-custom/bin/win/x64/
          test -f "nativephp-php-bin-custom/bin/win/x64/php-${{ matrix.php_version }}.zip"
          echo "NATIVEPHP_PHP_BINARY_PATH=nativephp-php-bin-custom/" >> "$GITHUB_ENV"

      # Drive the release version from the git tag (e.g. refs/tags/v1.2.0 ->
      # 1.2.0) so artifact filenames/app version stay in sync with the
      # release automatically — no manual version bump needed before
      # tagging. Falls back to config/nativephp.php's default on plain
      # pushes/manual runs, where there is no tag.
      - name: Derive app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "NATIVEPHP_APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build native app
        run: php artisan native:build ${{ matrix.target }} --no-interaction

      # NativePHP's BuildCommand ignores electron-builder's exit code, so a
      # failed pack still looks green. Fail here if installers are missing.
      - name: Assert installers were produced
        shell: bash
        run: |
          set -euo pipefail
          cd nativephp/electron/dist
          ls -la
          case "${{ matrix.label }}" in
            linux-x64)
              compgen -G 'tabulasql_*_amd64.deb' >/dev/null
              compgen -G 'TabulaSQL-*.AppImage' >/dev/null
              ;;
            windows-x64)
              compgen -G 'TabulaSQL-*-setup.exe' >/dev/null
              ;;
            macos-arm64)
              compgen -G 'TabulaSQL-*-arm64.dmg' >/dev/null
              ;;
            macos-x64)
              compgen -G 'TabulaSQL-*-x64.dmg' >/dev/null
              ;;
          esac

      # Release assets get a stable, version-free filename so a website's
      # download links (github.com/OWNER/REPO/releases/latest/download/<name>)
      # never need to change between releases.
      - name: Rename artifacts
        shell: bash
        run: |
          cd nativephp/electron/dist
          ls -la
          case "${{ matrix.label }}" in
            linux-x64)
              test -f tabulasql_*_amd64.deb || { echo "Missing .deb after native:build"; exit 1; }
              test -f TabulaSQL-*.AppImage || { echo "Missing AppImage after native:build"; ls -la; exit 1; }
              mv -v tabulasql_*_amd64.deb "TabulaSQL-linux-x64.deb"
              mv -v TabulaSQL-*.AppImage "TabulaSQL-linux-x64.AppImage"
              ;;
            windows-x64)
              test -f TabulaSQL-*-setup.exe || { echo "Missing Windows setup.exe after native:build"; ls -la; exit 1; }
              mv -v TabulaSQL-*-setup.exe "TabulaSQL-windows-x64-setup.exe"
              ;;
            macos-arm64)
              test -f TabulaSQL-*-arm64.dmg || { echo "Missing macOS arm64 dmg after native:build"; ls -la; exit 1; }
              mv -v TabulaSQL-*-arm64.dmg "TabulaSQL-macos-arm64.dmg"
              ;;
            macos-x64)
              test -f TabulaSQL-*-x64.dmg || { echo "Missing macOS x64 dmg after native:build"; ls -la; exit 1; }
              mv -v TabulaSQL-*-x64.dmg "TabulaSQL-macos-x64.dmg"
              ;;
          esac

      # Guard against shipping a desktop build without the bundled PHP CLI
      # (NativePHP beforePack race). Without this binary the app opens then
      # dies with spawn .../resources/build/php/php ENOENT.
      - name: Verify bundled PHP binary is present
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.label }}" in
            linux-x64)
              cd nativephp/electron/dist
              chmod +x TabulaSQL-linux-x64.AppImage
              ./TabulaSQL-linux-x64.AppImage --appimage-extract >/dev/null
              test -x squashfs-root/resources/build/php/php
              file squashfs-root/resources/build/php/php | grep -qi 'elf\|executable'
              ls -lh squashfs-root/resources/build/php/php
              rm -rf squashfs-root
              ;;
            windows-x64)
              # NSIS installer is not easy to inspect here; check unpacked dir
              # if electron-builder left one, otherwise skip.
              if [[ -f nativephp/electron/dist/win-unpacked/resources/build/php/php.exe ]]; then
                ls -lh nativephp/electron/dist/win-unpacked/resources/build/php/php.exe
              else
                echo "No win-unpacked tree to verify; relying on build logs."
              fi
              ;;
            macos-arm64|macos-x64)
              # DMG mount is awkward in CI; prefer unpacked .app if present.
              app=$(find nativephp/electron/dist -maxdepth 2 -type d -name '*.app' | head -1 || true)
              if [[ -n "$app" ]]; then
                test -x "$app/Contents/Resources/build/php/php"
                ls -lh "$app/Contents/Resources/build/php/php"
              else
                echo "No .app tree to verify; relying on build logs."
              fi
              ;;
          esac

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: nativephp/electron/dist/TabulaSQL-*
          if-no-files-found: error
          retention-days: 14

      - name: Attach to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nativephp/electron/dist/TabulaSQL-*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
